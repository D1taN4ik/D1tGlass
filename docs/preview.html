<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>D1tGlass preview</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 960px; height: 420px; overflow: hidden; background: #0b0b14; }
  body { font-family: Inter, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; color: #fff; }

  .bg { position: absolute; inset: 0; overflow: hidden;
    background: linear-gradient(120deg, #1a1040 0%, #2b0f3a 45%, #0d1b3d 100%); }
  .blob { position: absolute; border-radius: 50%; will-change: transform; }
  .b1 { width: 520px; height: 520px; background: radial-gradient(circle, #ff3d7f 0 38%, rgba(255,61,127,.0) 70%); }
  .b2 { width: 560px; height: 560px; background: radial-gradient(circle, #3d7bff 0 36%, rgba(61,123,255,0) 70%); }
  .b3 { width: 480px; height: 480px; background: radial-gradient(circle, #ffb400 0 34%, rgba(255,180,0,0) 70%); }
  .b4 { width: 360px; height: 360px; background: radial-gradient(circle, #29e0b0 0 32%, rgba(41,224,176,0) 70%); }

  .nav {
    position: absolute; left: 50%; top: 50%; translate: -50% -50%;
    width: 820px; height: 76px; border-radius: 38px;
    display: flex; align-items: center; padding: 0 10px 0 22px; gap: 14px;
  }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; letter-spacing: -.01em; width: 150px; }
  .logo i { width: 26px; height: 26px; border-radius: 9px; display: block;
    background: conic-gradient(from 200deg, #ff3d7f, #ffb400, #29e0b0, #3d7bff, #ff3d7f);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }

  .tabs { position: relative; flex: 1; height: 60px; display: grid; grid-template-columns: repeat(4, 1fr); }
  .pill { position: absolute; top: 0; left: 0; height: 60px; border-radius: 30px;
    background: rgba(255,255,255,.17);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), inset 0 1px 0 rgba(255,255,255,.45); }
  .tab { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,.62); }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: #fff; }

  .actions { display: flex; gap: 8px; }
  .btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .btn svg { width: 22px; height: 22px; }
  .avatar { background: linear-gradient(135deg, #ff9a3d, #ff3d7f); font-weight: 800; font-size: 17px; }
</style>
</head>
<body>
<div class="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>

<nav class="nav" data-refract data-rf-tint="dark" data-rf-saturate="140" data-rf-scale="62" data-rf-bezel="26" data-rf-aberration="0.12">
  <div class="logo"><i></i>D1tGlass</div>
  <div class="tabs">
    <div class="pill"></div>
    <div class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Explore</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Library</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Saved</div>
  </div>
  <div class="actions">
    <div class="btn" id="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></div>
    <div class="btn avatar" id="avatar">Y</div>
  </div>
</nav>

<script src="../refract.js"></script>
<script>
  // Deterministic timeline so frames can be captured one by one: setFrame(seconds)
  const LOOP = 6;
  const moves = [ // [time, target tab]
    [0.7, 1], [1.9, 2], [3.1, 3], [4.3, 0]
  ];
  const presses = [ // [time, element id] — small button taps
    [5.1, "search"], [5.55, "avatar"]
  ];

  const tabsEl = document.querySelector(".tabs");
  const pill = document.querySelector(".pill");
  const tabs = [...document.querySelectorAll(".tab")];
  const blobs = [...document.querySelectorAll(".blob")];

  // Damped spring step response (0 → 1 with a little overshoot)
  function spring(t, w = 13, z = 0.5) {
    if (t <= 0) return 0;
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
  }
  const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);

  // 0 → 1 while "pressed", springs back to 0 after release
  function pressAmount(t, at, hold = 0.28) {
    const down = at - 0.12;
    if (t < down) return 0;
    if (t < at) return smooth((t - down) / 0.12);
    if (t < at + hold) return 1;
    return 1 - spring(t - at - hold, 16, 0.45);
  }

  function setFrame(time) {
    const t = ((time % LOOP) + LOOP) % LOOP;

    // Background blobs drifting on loop-periodic paths
    const a = t / LOOP * Math.PI * 2;
    const paths = [
      [60, 40, 170, 90, 1],   // [cx, cy, rx, ry, speed]
      [560, -60, 160, 110, -1],
      [340, 120, 220, 80, 2],
      [700, 160, 150, 120, -2]
    ];
    blobs.forEach((b, i) => {
      const [cx, cy, rx, ry, s] = paths[i];
      b.style.transform = `translate(${cx + Math.cos(a * s + i) * rx - 120}px, ${cy + Math.sin(a * s + i * 2) * ry - 120}px)`;
    });

    // Pill position: chain of springs between tabs
    const tw = tabsEl.clientWidth / 4;
    const pos = moves.reduce((p, [at, to], i) => {
      if (t < at) return p;
      const start = i === 0 ? 0 : moves[i - 1][1];
      return start + (to - start) * spring(t - at);
    }, 0);

    // Press-to-grow
    const grow = Math.max(...moves.map(([at]) => pressAmount(t, at)));
    const sx = 1 + 0.16 * grow, sy = 1 + 0.30 * grow;
    pill.style.width = tw + "px";
    pill.style.transform = `translateX(${pos * tw}px) scale(${sx}, ${sy})`;
    pill.style.background = `rgba(255,255,255,${0.17 + 0.1 * grow})`;

    const nearest = Math.round(Math.min(3, Math.max(0, pos)));
    tabs.forEach((el, i) => el.classList.toggle("on", i === nearest));

    // Button taps
    presses.forEach(([at, id]) => {
      const p = pressAmount(t, at, 0.12);
      const el = document.getElementById(id);
      el.style.transform = `scale(${1 - 0.14 * p})`;
      el.style.filter = `brightness(${1 + 0.35 * p})`;
    });

    return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  }

  window.setFrame = setFrame;
  setFrame(0);
</script>
</body>
</html>
